# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
name: test-coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  id-token: write

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    name: test-coverage
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set custom R repositories
        run: |
          cat(
            'local({
              r <- getOption("repos")
              if (is.null(r["CRAN"]) || is.na(r["CRAN"]) || r["CRAN"] == "@CRAN@") {
                r["CRAN"] <- "https://cloud.r-project.org"
              }
              r["INLA"] <- "https://inla.r-inla-download.org/R/stable"
              r["giabaio"] <- "https://giabaio.r-universe.dev"
              options(repos = r)
            })\n',
            file = file.path(Sys.getenv("HOME"), ".Rprofile"),
            append = TRUE
          )
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::xml2
            giabaio/survHEhmc
          needs: coverage

      - name: Calculate test coverage
        run: covr::to_cobertura(covr::package_coverage(), "coverage.xml")
        shell: Rscript {0}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          use_oidc: true
