# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
name: test-coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    name: test-coverage
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set custom R repositories
        run: |
          r <- getOption("repos")
          r["CRAN"] <- "https://cloud.r-project.org"
          r["INLA"] <- "https://inla.r-inla-download.org/R/stable"
          r["giabaio"] <- "https://giabaio.r-universe.dev"
          options(repos = r)
          writeLines(
            'options(repos = c(CRAN = "https://cloud.r-project.org", INLA = "https://inla.r-inla-download.org/R/stable", giabaio = "https://giabaio.r-universe.dev"))',
            file.path(Sys.getenv("HOME"), ".Rprofile")
          )
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            giabaio/survHEhmc
          needs: coverage

      - name: Test coverage
        run: covr::codecov()
        shell: Rscript {0}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
